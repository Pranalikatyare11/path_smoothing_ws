<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Illustrative waypoint path smoothing plot</title>
  <desc id="description">Configured waypoint anchors joined by a raw polyline and a two-iteration Chaikin-smoothed illustrative curve. This is not a measured robot trajectory.</desc>
  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Waypoint path smoothing (illustrative)</text>
  <text x="500" y="59" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#536176">Configured assignment waypoint coordinates • two Chaikin corner-cutting iterations</text>

  <rect x="100" y="80" width="800" height="420" fill="#fbfcfe" stroke="#344054" stroke-width="1.5"/>
  <g stroke="#dce2ea" stroke-width="1">
    <line x1="147.1" y1="80" x2="147.1" y2="500"/>
    <line x1="241.2" y1="80" x2="241.2" y2="500"/>
    <line x1="335.3" y1="80" x2="335.3" y2="500"/>
    <line x1="429.4" y1="80" x2="429.4" y2="500"/>
    <line x1="523.5" y1="80" x2="523.5" y2="500"/>
    <line x1="617.6" y1="80" x2="617.6" y2="500"/>
    <line x1="711.8" y1="80" x2="711.8" y2="500"/>
    <line x1="805.9" y1="80" x2="805.9" y2="500"/>
    <line x1="900" y1="80" x2="900" y2="500"/>
    <line x1="100" y1="486.2" x2="900" y2="486.2"/>
    <line x1="100" y1="417.4" x2="900" y2="417.4"/>
    <line x1="100" y1="348.5" x2="900" y2="348.5"/>
    <line x1="100" y1="279.7" x2="900" y2="279.7"/>
    <line x1="100" y1="210.8" x2="900" y2="210.8"/>
    <line x1="100" y1="142" x2="900" y2="142"/>
  </g>

  <g font-family="sans-serif" font-size="12" fill="#475467" text-anchor="middle">
    <text x="147.1" y="520">-8</text><text x="241.2" y="520">-6</text>
    <text x="335.3" y="520">-4</text><text x="429.4" y="520">-2</text>
    <text x="523.5" y="520">0</text><text x="617.6" y="520">2</text>
    <text x="711.8" y="520">4</text><text x="805.9" y="520">6</text>
    <text x="900" y="520">8</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#475467" text-anchor="end">
    <text x="90" y="490">2</text><text x="90" y="421">3</text>
    <text x="90" y="352">4</text><text x="90" y="284">5</text>
    <text x="90" y="215">6</text><text x="90" y="146">7</text>
  </g>
  <text x="500" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#344054">Map x coordinate (m)</text>
  <text x="28" y="290" text-anchor="middle" transform="rotate(-90 28 290)" font-family="sans-serif" font-size="14" fill="#344054">Map y coordinate (m)</text>

  <polyline points="846.8,455.9 836.9,117.2 378.1,211.5 144.7,235.6 248.2,462.1" fill="none" stroke="#98a2b3" stroke-width="3" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <polyline points="846.8,455.9 846.2,434.8 845.0,392.4 843.1,328.9 840.6,244.2 810.1,186.6 751.5,156.0 664.9,152.6 550.2,176.1 449.6,195.3 363.0,210.1 290.6,220.5 232.2,226.6 194.9,245.2 178.7,276.6 183.5,320.6 209.4,377.2 228.8,419.7 241.8,448.0 248.2,462.1" fill="none" stroke="#1677c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#f79009" stroke="#ffffff" stroke-width="2">
    <circle cx="846.8" cy="455.9" r="7"/><circle cx="836.9" cy="117.2" r="7"/>
    <circle cx="378.1" cy="211.5" r="7"/><circle cx="144.7" cy="235.6" r="7"/>
    <circle cx="248.2" cy="462.1" r="7"/>
  </g>
  <g font-family="sans-serif" font-size="12" font-weight="700" fill="#7a3e00">
    <text x="857" y="452">W1</text><text x="847" y="108">W2</text>
    <text x="389" y="205">W3</text><text x="153" y="226">W4</text>
    <text x="259" y="462">W5</text>
  </g>

  <g transform="translate(170 570)" font-family="sans-serif" font-size="13" fill="#344054">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#98a2b3" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="52" y="5">Raw polyline through waypoints</text>
    <line x1="300" y1="0" x2="342" y2="0" stroke="#1677c8" stroke-width="4"/>
    <text x="352" y="5">Illustrative smoothed curve</text>
    <circle cx="620" cy="0" r="6" fill="#f79009"/>
    <text x="633" y="5">Configured waypoint</text>
  </g>
  <rect x="120" y="603" width="760" height="30" rx="5" fill="#fff4e5" stroke="#f79009"/>
  <text x="500" y="623" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#7a3e00">Illustration only — waypoint-anchor geometry, not a Nav2 path or measured robot trajectory.</text>
</svg>
