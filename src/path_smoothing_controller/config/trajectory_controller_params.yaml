controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "path_smoothing_controller/TrajectoryPurePursuit"
      max_linear_velocity: 0.26
      max_angular_velocity: 1.0
      max_linear_acceleration: 0.5
      max_angular_acceleration: 1.5
      sample_spacing: 0.05
      lookahead_distance: 0.45
      waypoint_match_tolerance: 0.10
      smoothing_iterations: 2
      blocked_cost_threshold: 253
      dynamic_obstacle_cost_threshold: 253
      goal_tolerance: 0.20
      yaw_tolerance: 0.20
      global_costmap_topic: /global_costmap/costmap_raw
      planner_through_poses_action: /compute_path_through_poses
      planner_id: GridBased
      replan_retry_interval: 1.0
      costmap_topic: /global_costmap/costmap_raw
      local_costmap_topic: /costmap/costmap_raw
      local_costmap_check_distance: 0.75
      local_costmap_stale_timeout: 1.0
      waypoints_xy: [6.87, 2.44, 6.66, 7.36, -3.09, 5.99, -8.05, 5.64, -5.85, 2.35]

trajectory_controller:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    max_linear_velocity: 0.26
    max_angular_velocity: 1.0
    max_linear_acceleration: 0.5
    max_angular_acceleration: 1.5
    sample_spacing: 0.05
    lookahead_distance: 0.45
    smoothing_iterations: 2
    blocked_cost_threshold: 253
    dynamic_obstacle_cost_threshold: 253
    goal_tolerance: 0.20
    yaw_tolerance: 0.20
    tracking_failure_distance: 1.25
    tracking_failure_timeout: 3.0
    replan_retry_interval: 1.0
    costmap_topic: /global_costmap/costmap_raw
    local_costmap_topic: /costmap/costmap_raw
    local_costmap_check_distance: 0.75
    local_costmap_stale_timeout: 1.0
    planner_action: /compute_path_to_pose
    planner_id: GridBased
    waypoint_goal_yaw: 0.0
    # Five ordered (x, y) waypoints in map coordinates; edit this list for a run.
    waypoints_xy: [6.87, 2.44, 6.66, 7.36, -3.09, 5.99, -8.05, 5.64, -5.85, 2.35]
